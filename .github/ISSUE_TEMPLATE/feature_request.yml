name: Feature request
description: Suggest an improvement or a new feature
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Check `docs/GAME_DESIGN.md` first — the roadmap is there, and a feature
        may already be planned or deliberately out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should the app or server do? Mockups are welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Catching, party or PC
        - Pokédex or collection
        - Battle (AI or friend)
        - Social and QR
        - Economy, shop or crafting
        - Server or API
        - Setup, hosting or CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Existing behaviour, other games, or why a simpler fix is not enough.
  - type: checkboxes
    id: contribution
    attributes:
      label: Would you like to build it?
      options:
        - label: I can open a pull request for this
