name: APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Game server URL baked into the APK (e.g. http://203.0.113.10:25565)'
        required: false
        type: string
      supabase_url:
        description: 'Supabase project URL (optional)'
        required: false
        type: string
      supabase_anon_key:
        description: 'Supabase anon/publishable key (optional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.0

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

  build:
    name: Build release APK
    needs: test
    # Dependabot pull requests only need the analyze/test job; skip the long
    # release build and its artifact upload.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Only this job needs write access, and only to attach a tagged release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get
        working-directory: app

      # Values come from the manual-run inputs when present, otherwise from
      # repository variables (Settings → Secrets and variables → Actions →
      # Variables): API_BASE_URL, SUPABASE_URL, SUPABASE_ANON_KEY.
      # Leave everything unset to build with local defaults and Social off.
      - name: Build APK
        working-directory: app
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
          SUPABASE_URL: ${{ inputs.supabase_url || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ inputs.supabase_anon_key || vars.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Name the artifact
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk \
            "dist/pokeventure-${GITHUB_REF_NAME//\//-}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: pokeventure-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
