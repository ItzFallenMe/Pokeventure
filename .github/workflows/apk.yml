name: APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.0

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

  build:
    name: Build release APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get
        working-directory: app

      # Optional repository variables (Settings → Secrets and variables →
      # Actions → Variables):
      #   API_BASE_URL        public game-server URL, e.g. https://…onrender.com
      #   SUPABASE_URL        https://YOUR-PROJECT.supabase.co
      #   SUPABASE_ANON_KEY   the public anon/publishable key
      # Leave them unset to build with local defaults and Social disabled.
      - name: Build APK
        working-directory: app
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}

      - name: Name the artifact
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk \
            "dist/pokeventure-${GITHUB_REF_NAME//\//-}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: pokeventure-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
